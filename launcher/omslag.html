<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Taktiktavle omslag</title>
<!-- Omslaget i MG Games-launcheren (1920 × 700). Laves med headless Chrome og gemmes som jpg; se README. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Big+Shoulders+Display:wght@800&display=block">
<style>
  html, body { margin: 0; width: 1920px; height: 700px; overflow: hidden; background: #10301a; }
  .scene { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 66% -20%; overflow: hidden;
    background: radial-gradient(90% 130% at 70% 45%, #1f5a2c 0%, #133d1d 50%, #0a2111 100%); }
  .pitch { position: absolute; left: 1385px; top: 352px; width: 1060px; height: 686px; margin: -368px 0 0 -530px;
    transform: rotateX(44deg) rotateZ(-9deg); transform-origin: 50% 50%; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(7,19,11,.97) 0%, rgba(7,19,11,.93) 32%, rgba(7,19,11,.5) 45%, rgba(7,19,11,0) 57%, rgba(7,19,11,0) 92%, rgba(7,19,11,.55) 100%),
      linear-gradient(180deg, rgba(7,19,11,.45) 0%, rgba(7,19,11,0) 20%, rgba(7,19,11,0) 80%, rgba(7,19,11,.5) 100%); }
  .mark { position: absolute; left: 132px; top: 50%; transform: translateY(-50%); color: #fff; }
  .mark .kicker { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; }
  .mark .kicker b { display: block; width: 46px; height: 5px; border-radius: 3px; background: #ff8f4d; }
  .mark .kicker span { font: 700 21px/1 Archivo, system-ui, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: #ff8f4d; }
  .mark h1 { margin: 0; font: 800 156px/0.86 'Big Shoulders Display', 'Arial Narrow', sans-serif; letter-spacing: .03em;
    text-transform: uppercase; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
  .mark h1 span { color: #ff8f4d; }
  .mark p { margin: 22px 0 0; font: 600 25px/1.35 Archivo, system-ui, sans-serif; letter-spacing: .02em; color: rgba(255,255,255,.82); }
</style>
</head>
<body>
<div class="scene">
  <div class="pitch"><svg id="pitch" viewBox="-6 -6 117 80" preserveAspectRatio="none"></svg></div>
  <div class="shade"></div>
  <div class="mark">
    <div class="kicker"><b></b><span>Fodbold</span></div>
    <h1>Taktik<span>tavle</span></h1>
    <p>Sæt holdet, tegn taktikken og se kampen spillet.</p>
  </div>
</div>
<script>
// Banen i meter (105 × 68), samme farver som appens mørke tema.
const s = document.getElementById('pitch'), NS = 'http://www.w3.org/2000/svg';
const el = (n, a, p = s) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
el('rect', { x: -6, y: -6, width: 117, height: 80, fill: '#1d4c27' });
for (let i = 0; i < 14; i++) el('rect', { x: i * 7.5, y: 0, width: 7.5, height: 68, fill: i % 2 ? '#296633' : '#2e7139' });
const chalk = { fill: 'none', stroke: 'rgba(255,255,255,.84)', 'stroke-width': .32 };
el('rect', { x: 0, y: 0, width: 105, height: 68, ...chalk });
el('line', { x1: 52.5, y1: 0, x2: 52.5, y2: 68, ...chalk });
el('circle', { cx: 52.5, cy: 34, r: 9.15, ...chalk });
el('circle', { cx: 52.5, cy: 34, r: .45, fill: 'rgba(255,255,255,.84)' });
for (const [x, d] of [[0, 1], [105, -1]]) {
  el('rect', { x: d > 0 ? 0 : 105 - 16.5, y: 13.84, width: 16.5, height: 40.32, ...chalk });
  el('rect', { x: d > 0 ? 0 : 105 - 5.5, y: 24.84, width: 5.5, height: 18.32, ...chalk });
  el('circle', { cx: x + d * 11, cy: 34, r: .4, fill: 'rgba(255,255,255,.84)' });
  el('path', { d: `M ${x + d * 16.5} ${34 - 7.3} A 9.15 9.15 0 0 ${d > 0 ? 1 : 0} ${x + d * 16.5} ${34 + 7.3}`, ...chalk });
  el('rect', { x: d > 0 ? -2 : 105, y: 30.34, width: 2, height: 7.32, fill: 'none', stroke: 'rgba(255,255,255,.6)', 'stroke-width': .25 });
}
// Hjemmeholdet (orange, 4-3-3 mod højre) og udeholdet (hvidt, 4-4-2 mod venstre).
const home = [[5, 34, 1], [24, 10, 2], [21, 26, 4], [21, 42, 5], [24, 58, 3], [38, 34, 6], [44, 20, 8], [46, 48, 10],
  [63, 9, 7], [72, 36, 9], [64, 57, 11]];
const away = [[100, 34, 1], [83, 12, 2], [86, 27, 5], [86, 41, 4], [83, 56, 3], [71, 17, 7], [74, 28, 8], [74, 42, 6],
  [70, 55, 11], [58, 28, 9], [56, 42, 10]];
// Løb og afleveringer (stiplede pile) og en presszone.
const defs = el('defs', {});
const mk = el('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 3.2, markerHeight: 3.2, orient: 'auto-start-reverse' }, defs);
el('path', { d: 'M0 0 L10 5 L0 10 z', fill: '#fff' }, mk);
const mk2 = el('marker', { id: 'ah2', viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 3.2, markerHeight: 3.2, orient: 'auto' }, defs);
el('path', { d: 'M0 0 L10 5 L0 10 z', fill: '#ff8f4d' }, mk2);
el('ellipse', { cx: 78, cy: 34, rx: 10, ry: 13, fill: 'rgba(255,143,77,.16)', stroke: 'rgba(255,143,77,.7)', 'stroke-width': .3, 'stroke-dasharray': '1.2 .8' });
const arrow = (d, col = '#fff', m = 'ah') => el('path', { d, fill: 'none', stroke: col, 'stroke-width': .55, 'stroke-dasharray': '1.6 1', 'stroke-linecap': 'round', 'marker-end': `url(#${m})` });
arrow('M 46 48 Q 60 52 69.5 40.5', '#ff8f4d', 'ah2');
arrow('M 64 57 Q 80 61 89 51');
arrow('M 63 9 Q 79 5 90 15');
const token = (x, y, n, fill, ring, text) => {
  el('ellipse', { cx: x + .35, cy: y + .5, rx: 2.35, ry: 2.35, fill: 'rgba(0,0,0,.35)' });
  el('circle', { cx: x, cy: y, r: 2.3, fill, stroke: ring, 'stroke-width': .5 });
  const t = el('text', { x, y: y + .95, 'text-anchor': 'middle', fill: text, 'font-family': "'Big Shoulders Display', sans-serif", 'font-weight': 800, 'font-size': 2.9 });
  t.textContent = n;
};
for (const [x, y, n] of away) token(x, y, n, '#f4f6f4', '#1b3a24', '#142019');
for (const [x, y, n] of home) token(x, y, n, n === 1 ? '#f2c230' : '#ff8f4d', '#fff', '#2a1104');
el('circle', { cx: 71, cy: 39, r: .9, fill: '#fff', stroke: '#142019', 'stroke-width': .2 });
</script>
</body>
</html>
